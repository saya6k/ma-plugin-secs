name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check --no-fix .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run codespell

  test:
    name: Tests
    runs-on: ubuntu-latest
    # the base of the server image, as in the devcontainer: the tests run the server's DSP filters
    # through ffmpeg, whose filters differ between versions, so they use the ffmpeg the server has
    container: ghcr.io/music-assistant/base:1.7.1
    steps:
      # as in the devcontainer: git for the server, which the lock file takes from its repository,
      # and the compilers for a server requirement that is built from source
      - run: apt-get update && apt-get install -y --no-install-recommends git gcc g++
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest

  # the checks every release gets in the catalog: the manifest, the requirements against a server
  # line and loading the provider in the server image of that line
  catalog:
    name: Catalog checks
    uses: music-assistant/community-catalog/.github/workflows/check-provider.yml@main
    with:
      folder: secs_room_correction
      server-line: nightly
